name: New Starter client project
description: Internal operator record created from a discovery interview; this is not a client-facing questionnaire.
title: "[STARTER] "
body:
  - type: markdown
    attributes:
      value: |
        Internal operator record only — populate from a normal discovery interview and existing material. Do not send this form to clients or ask them to complete a second questionnaire. Never enter passwords, API keys, payment details, or sensitive customer records.
  - type: input
    id: business
    attributes:
      label: Business / project contact (operator-recorded)
    validations:
      required: true
  - type: input
    id: channel
    attributes:
      label: Contact channel or public business profile
    validations:
      required: false
  - type: dropdown
    id: tier
    attributes:
      label: Initial tier assessment
      options:
        - Starter — likely fit
        - Business — likely multi-page
        - Custom — backend/integration/bespoke
        - Not assessed
    validations:
      required: true
  - type: textarea
    id: business-summary
    attributes:
      label: Interview/material summary (operator-recorded)
      description: Summarize the provided source material. Do not ask the client to complete this issue.
    validations:
      required: true
  - type: textarea
    id: website-goal
    attributes:
      label: Website goal / primary visitor action (derived from interview)
    validations:
      required: true
  - type: checkboxes
    id: capabilities
    attributes:
      label: Potential capabilities requested
      options:
        - label: Multiple pages
        - label: CMS/admin editing
        - label: Booking records
        - label: Login/membership
        - label: Payment/checkout
        - label: External API integration
        - label: Standard contact/WhatsApp CTA
  - type: textarea
    id: assets
    attributes:
      label: Existing assets and materials
      description: Logo, brand guide, copy, photos, domain, existing site. Missing imagery is not a blocker.
    validations:
      required: false
  - type: input
    id: approver
    attributes:
      label: Decision maker / approver
    validations:
      required: false
  - type: input
    id: launch-date
    attributes:
      label: Desired launch date
    validations:
      required: false
