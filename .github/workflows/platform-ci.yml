name: platform-ci

on:
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'
  push:
    branches:
      - main
      - 'revision/master-revision'
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Validate Composer manifest and lock file
        run: composer validate --strict --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run database migrations
        run: |
          touch database/database.sqlite
          php artisan migrate --force

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run CI checks
        run: composer run-script ci:check

      - name: Publish CI evidence summary
        if: always()
        run: |
          php_version="$(php -r 'echo PHP_VERSION;' 2>/dev/null || echo unavailable)"
          composer_version="$(composer --version --no-ansi 2>/dev/null || echo unavailable)"
          node_version="$(node --version 2>/dev/null || echo unavailable)"
          npm_version="$(npm --version 2>/dev/null || echo unavailable)"
          {
            echo "## Platform CI evidence"
            echo
            echo "- Result: \`\${{ job.status }}\`"
            echo "- Commit: \`\${GITHUB_SHA}\`"
            echo "- Ref: \`\${GITHUB_REF_NAME}\`"
            echo "- PHP: \`\${php_version}\`"
            echo "- Composer: \`\${composer_version}\`"
            echo "- Node: \`\${node_version}\`"
            echo "- npm: \`\${npm_version}\`"
          } >> "\${GITHUB_STEP_SUMMARY}"
