name: Blank Starter foundation CI

on:
  push:
    branches: [main, 'feat/**', 'improvement/**', 'restructure/**', 'revision/**']
    paths:
      - 'blueprints/starter/blank/**'
      - '.github/workflows/blank-starter-ci.yml'
  pull_request:
    paths:
      - 'blueprints/starter/blank/**'
      - '.github/workflows/blank-starter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: blueprints/starter/blank
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blueprints/starter/blank/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production site
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Run Blank Starter foundation smoke tests
        run: npm run test:e2e
      - name: Upload foundation smoke-test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blank-starter-foundation-evidence
          path: blueprints/starter/blank/test-results/
          include-hidden-files: true
          if-no-files-found: warn
