name: Starter blueprint CI

on:
  push:
    branches: [main, 'improvement/**', 'restructure/**', 'revision/**']
    paths:
      - "blueprints/starter/template-kit/starter/**"
      - ".github/workflows/starter-blueprint-ci.yml"
      - "docs/STARTER_AUTOMATED_QUALITY_GATE_v1.0.md"
      - "docs/STARTER_PRODUCT_ACCEPTANCE_GATE_v1.1.md"
      - "docs/STARTER_CONTENT_EVIDENCE_GATE_v1.0.md"
      - "docs/STARTER_CONTENT_EVIDENCE_CALIBRATION_2026-11-15.md"
      - "docs/STARTER_CALIBRATION_RECORD_2026-11-15.md"
      - "docs/WEBSITE_IMPLEMENTATION_STANDARD_v1.1_CANDIDATE.md"
      - "docs/STARTER_PRODUCTION_READINESS_AUDIT_2026-11-16.md"
      - "blueprints/starter/template-kit/docs/starter-responsive-qa.md"
      - "blueprints/starter/template-kit/docs/five-website-starter-audit.md"
  pull_request:
    paths:
      - "blueprints/starter/template-kit/starter/**"
      - ".github/workflows/starter-blueprint-ci.yml"
      - "docs/STARTER_AUTOMATED_QUALITY_GATE_v1.0.md"
      - "docs/STARTER_PRODUCT_ACCEPTANCE_GATE_v1.1.md"
      - "docs/STARTER_CONTENT_EVIDENCE_GATE_v1.0.md"
      - "docs/STARTER_CONTENT_EVIDENCE_CALIBRATION_2026-11-15.md"
      - "docs/STARTER_CALIBRATION_RECORD_2026-11-15.md"
      - "docs/WEBSITE_IMPLEMENTATION_STANDARD_v1.1_CANDIDATE.md"
      - "docs/STARTER_PRODUCTION_READINESS_AUDIT_2026-11-16.md"
      - "blueprints/starter/template-kit/docs/starter-responsive-qa.md"
      - "blueprints/starter/template-kit/docs/five-website-starter-audit.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-responsive-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: blueprints/starter/template-kit/starter
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blueprints/starter/template-kit/starter/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Starter
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Run responsive and interaction smoke tests
        run: npm run test:e2e
