name: temporary-format-snapshot

on:
  pull_request:
    paths:
      - 'platform/resources/js/pages/projects/discovery.tsx'
      - '.github/workflows/temporary-format-snapshot.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply repository formatter
        run: npm run check:fix
        continue-on-error: true

      - name: Upload formatted discovery component
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatted-discovery-component
          path: platform/resources/js/pages/projects/discovery.tsx
          if-no-files-found: error
