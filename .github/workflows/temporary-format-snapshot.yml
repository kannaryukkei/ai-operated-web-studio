name: temporary-format-snapshot

on:
  pull_request:
    paths:
      - 'platform/resources/js/pages/projects/discovery.tsx'
      - '.github/workflows/temporary-format-snapshot.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply repository formatter
        run: npm run check:fix
        continue-on-error: true

      - name: Commit formatter changes
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- resources/js/pages/projects/discovery.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add resources/js/pages/projects/discovery.tsx
            git commit -m "style: apply repository formatter to discovery UI"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
